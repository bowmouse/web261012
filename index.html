<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <h1>내 영화 보드</h1>
    <article class="card">
        <img class="poster" src="https://image.tmdb.org/t/p/w342/yQvGrMoipbRoddT0ZR8tPoR7NfX.jpg"

        <span class="badge">8.4</span>
        <div class="info">
            <h2>Interstellar</h2>
            <p class="year">2014</p>
            <p class="overview">새로 발견된 웜홀을 이용해 인간 우주 여행의 한계를 뛰어넘고 성간 여행에 수반되는 광대한 거리를 정복하는 탐험가들의 모험.</p>
        </div>
